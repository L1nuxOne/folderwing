<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="table.css"><script defer src="table.js"></script>
<link rel="stylesheet" href="navigation.css"><script defer src="navigation.js"></script></head><body><header><strong>Table preview</strong><span id="status">Loading…</span></header>
<div class="toolbar"><label>Delimiter <select id="delimiter"><option value="comma">Comma</option><option value="tab">Tab</option><option value="semicolon">Semicolon</option></select></label>
<label>Encoding <select id="encoding"><option value="utf8">UTF-8 / BOM</option><option value="windows1252">Windows-1252</option></select></label>
<label><input type="checkbox" id="header" checked> First row is header</label><input id="filter" type="search" placeholder="Filter loaded rows">
<button id="more">Load more rows</button><button id="restart">Back to first row</button></div>
<div class="toolbar columns"><button id="prev">Previous columns</button><span id="column-status"></span><button id="next">Next columns</button><span id="sort-status"></span></div>
<div class="grid"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<div id="detail" hidden><div><strong>Cell value</strong><button id="copy">Copy</button><button id="close">Close</button></div><pre id="value"></pre></div>
</body></html>
